[project]
name = "regression-analysis"
version = "0.1.0"
description = "Interactive regression analysis tool with Streamlit frontend"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35",
    "pandas>=2.0",
    "numpy",
    "statsmodels",
    "plotly",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "pydantic",
    "loguru",
    "openpyxl",
    "xlsxwriter",
    "python-docx",
    "jinja2>=3.1",
    "kaleido>=1.3.0",
    "linearmodels>=7.0",
]

[project.optional-dependencies]
export = [
    "weasyprint",
    "kaleido",
]
sas = [
    "pyreadstat",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[project.urls]
Homepage = "https://github.com/qhWangAntoneva/Regression-Analysis"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
exclude = ["samples/"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_configs = true

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.14",
]
