name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'app/**'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

jobs:
  # -----------------------------------------------------------------------
  # GitHub Pages — deploy web/ to qhWangAntoneva.github.io
  # -----------------------------------------------------------------------
  deploy-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        env:
          PAGES_REPO: qhWangAntoneva/qhWangAntoneva.github.io
          TARGET_SUBDIR: regression-analysis
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          echo "Deploying web/ to $PAGES_REPO at /$TARGET_SUBDIR/"

          # Clone the pages repo
          PAGES_DIR="/tmp/gh-pages-deploy-$$"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/$PAGES_REPO.git" "$PAGES_DIR" --depth 1

          # Clear and copy web assets
          TARGET="$PAGES_DIR/$TARGET_SUBDIR"
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          cp -r web/* "$TARGET/"
          rm -f "$TARGET/deploy.sh"

          # Commit and push
          cd "$PAGES_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$TARGET_SUBDIR/"
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "deploy: regression-analysis web app update

          Source: ${{ github.repository }}@${{ github.sha }}
          $(date -Iseconds)"
            git push
            echo "Deployed successfully to https://qhwangantoneva.github.io/$TARGET_SUBDIR/"
          fi
          rm -rf "$PAGES_DIR"

  # -----------------------------------------------------------------------
  # Docker — build image and push to ghcr.io
  # -----------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: []  # independent of pages deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
