name: Deploy

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - 'src/**'
      - 'app/**'
      - '.streamlit/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  packages: write

jobs:
  # -----------------------------------------------------------------------
  # GitHub Pages — deploy web/ to qhWangAntoneva.github.io
  # -----------------------------------------------------------------------
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAT }}
          external_repository: qhWangAntoneva/qhWangAntoneva.github.io
          publish_dir: ./web
          destination_dir: regression-analysis
          publish_branch: master
          keep_files: true
          commit_message: "deploy: regression-analysis ${{ github.sha }}"

  # -----------------------------------------------------------------------
  # Docker — build image and push to ghcr.io
  # -----------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: []  # independent of pages deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
